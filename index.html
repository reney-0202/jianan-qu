<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>建安区市政服务中心（非官方网站）</title>
<meta name="description" content="建安区市政服务中心——个人制作的非官方网站，内容筹备中。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231f3a5f'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23fff'%3E建%3C/text%3E%3C/svg%3E">
<style>
  :root { --navy: #1f3a5f; --ink: #1f2933; --muted: #667085; --line: #e4e7ec; --bg: #f7f8fa; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); background: var(--bg); line-height: 1.7;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; width: 100%; }
  .notice { background: #eef2f7; border-bottom: 1px solid var(--line); color: #475467; font-size: 13px; text-align: center; padding: 6px 12px; }
  header { background: var(--navy); color: #fff; padding: 36px 0; }
  header h1 { margin: 0; font-size: clamp(26px, 5vw, 38px); letter-spacing: 3px; font-weight: 700; }
  header p { margin: 6px 0 0; opacity: .8; font-size: 14px; letter-spacing: 1px; }
  main { flex: 1; padding: 48px 0; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 40px 28px; text-align: center; }
  .card h2 { margin: 0 0 8px; font-size: 22px; color: var(--navy); }
  .card p { margin: 0; color: var(--muted); }
  footer { border-top: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  footer p { margin: 2px 0; }
</style>
</head>
<body>

<div class="notice">本站为个人制作的非官方网站，不是任何政府机构的官方网站，不办理任何政务业务。</div>

<header>
  <div class="wrap">
    <h1>建安区市政服务中心</h1>
    <p>非官方网站</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="card">
      <h2>内容筹备中</h2>
      <p>页面正在更新，敬请期待。</p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>本站与任何政府机关、事业单位无隶属或合作关系，不收集任何用户信息。</p>
  </div>
</footer>

</body>
</html>
